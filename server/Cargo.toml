[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[features]
# The TEST module entrypoint: the same production code PLUS one reducer per test
# set (see src/test_reducers.rs). Off in production; the e2e harness publishes a
# separate test database with it on. Stateful, real-DB testing — no mocks.
testing = []

[dependencies]
spacetimedb = "2.8.1"
log = "0.4"
derive_builder = "0.20.2"
sha2 = "0.10"
ecs.workspace = true
secador.workspace = true
